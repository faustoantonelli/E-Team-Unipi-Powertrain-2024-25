name: Universal QA System

on:
  push:
    paths:
      - '**.cpp'
      - '**.py'
      - '**.m'
      - '**.tex'

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: docker build -t qa-engine -f docker/Dockerfile .

      - name: Run Engine su tutti i file
        run: |
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          
          # Cerchiamo ricorsivamente tutti i file validi ignorando il tester e i file nascosti
          # Il pipe verso 'while IFS=' è fondamentale per i nomi con spazi
          find . -type f \( -name "*.cpp" -o -name "*.py" -o -name "*.m" -o -name "*.tex" \) -not -path "./tester.cpp" -not -path "*/.*" -print0 | while IFS= read -d '' -r file; do
            echo "🚀 ANALIZZANDO: $file"
            # Quotiamo "$file" per proteggere gli spazi durante il passaggio al container
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file"
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa_report.log