name: Universal QA System

on:
  push:
  workflow_dispatch: 

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          # Cerca il Dockerfile ovunque per sicurezza
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Run Engine su tutti i file
        run: |
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          
          # Cerchiamo i file usando -print0 per gestire i nomi con SPAZI
          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.tex" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            echo "🚀 Analizzando: $file"
            # Eseguiamo docker. Il file qa_report.log viene aggiornato dal tester dentro il container
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file"
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Automotive-Report
          path: qa_report.log