name: Universal QA System

on:
  push:
    paths:
      - '**.cpp'
      - '**.py'
      - '**.m'
      - '**.tex'
  workflow_dispatch: # Permette di avviarlo anche manualmente per test

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        # Essendo il Dockerfile nella root, il comando è semplificato
        run: docker build -t qa-engine -f docker/Dockerfile .

      - name: Run Engine su tutti i file
        run: |
          # 1. Inizializziamo il report
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          echo "Data: $(date)" >> qa_report.log
          echo "------------------------------------------------" >> qa_report.log
        
          # 2. Ricerca ricorsiva sicura
          # Partiamo dalla cartella specifica. 
          # -print0 insieme a 'read -d' gestisce perfettamente spazi e slash nel nome.
          find "Traction Control 2025/26" -type f \( -name "*.cpp" -o -name "*.py" -o -name "*.m" -o -name "*.tex" \) -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            echo "🚀 ANALIZZANDO: $file"
            
            # 3. Esecuzione Docker
            # Passiamo "$file" tra virgolette per proteggere il percorso
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file"
            
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa_report.log