name: QA System with History Navigation

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Prepara Cartelle e Run
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M')
          mkdir -p "deploy/runs/$TIMESTAMP"
          
          # Indice della singola sessione
          echo "<html><head><style>body{font-family:sans-serif;background:#f4f7f6;padding:40px;} .card{background:white;padding:30px;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);} a{color:#1a73e8;text-decoration:none;font-weight:bold;} li{margin:10px 0;}</style></head><body>" > "deploy/runs/$TIMESTAMP/index.html"
          echo "<div class='card'><h1>🚀 Sessione di Test: $TIMESTAMP</h1><ul>" >> "deploy/runs/$TIMESTAMP/index.html"

          # Esecuzione Test
          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.m" -o -name "*.py" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file" 8
            sudo chmod 777 "$file.html" || true
            if [ -f "$file.html" ]; then
              FILE_NAME=$(basename "$file")
              mv "$file.html" "deploy/runs/$TIMESTAMP/"
              echo "<li>📄 <a href='$FILE_NAME.html'>$FILE_NAME</a></li>" >> "deploy/runs/$TIMESTAMP/index.html"
            fi
          done
          echo "</ul><br><hr><a href='../../index.html'>⬅️ Torna alla Cronologia Globale</a></div></body></html>" >> "deploy/runs/$TIMESTAMP/index.html"

      - name: Rigenera Home Page Globale
        run: |
          mkdir -p old_pages
          # Recuperiamo la storia dal branch gh-pages
          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git old_pages || true
          
          # Uniamo i vecchi dati ai nuovi
          if [ -d "old_pages/runs" ]; then
            cp -r old_pages/runs/* deploy/runs/
          fi

          # Pagina principale dell'archivio
          echo "<html><head><style>body{font-family:sans-serif;background:#e9ecef;padding:50px;} .container{max-width:800px;margin:auto;background:white;padding:40px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);} h1{color:#1a73e8;border-bottom:2px solid #1a73e8;padding-bottom:10px;} .session-link{display:block;padding:15px;margin:10px 0;background:#f8f9fa;border-left:5px solid #1a73e8;text-decoration:none;color:#333;font-weight:bold;transition:0.2s;} .session-link:hover{background:#eef2f7; transform:translateX(5px);}</style></head><body>" > deploy/index.html
          echo "<div class='container'><h1>🏎️ E-Team Powertrain - Archivio QA</h1>" >> deploy/index.html
          echo "<h3>Cronologia Sessioni:</h3>" >> deploy/index.html
          
          # Generazione automatica dei link per ogni cartella trovata
          ls -d deploy/runs/* 2>/dev/null | sort -r | while read dir; do
            TIME_LABEL=$(basename "$dir")
            echo "<a href='runs/$TIME_LABEL/index.html' class='session-link'>📂 Sessione del $TIME_LABEL</a>" >> deploy/index.html
          done
          
          echo "</div></body></html>" >> deploy/index.html

      - name: Deploy su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true