name: Universal QA System

on:
  push:
    paths:
      - '**.cpp'
      - '**.py'
      - '**.m'
      - '**.tex'

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: docker build -t qa-engine -f docker/Dockerfile .

      - name: Run Engine su tutti i file
        run: |
          # 1. Prepariamo il file di log (vuoto all'inizio)
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          
          # 2. Troviamo TUTTI i file validi (escludendo il tester e la cartella docker)
          # Trova i file in ogni sottocartella, escludendo tester.cpp e file nascosti
          # Usiamo -not -path '*/.*' per evitare cartelle tipo .git
          FILES=$(find . -type f \( -name "*.cpp" -o -name "*.py" -o -name "*.m" -o -name "*.tex" \) -not -path "./tester.cpp" -not -path "*/.*")
          
          for file in $FILES; do
            # Rimuoviamo il prefisso ./ per passare il percorso pulito al container
            TARGET_PATH=$(echo $file | sed 's|^\./||')
            echo "🚀 ANALISI IN CORSO SU: $TARGET_PATH"
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$TARGET_PATH"
          done
          
          # 3. Ciclo per testarli uno ad uno
          for file in $FILES; do
            echo "------------------------------------------------"
            echo "🚀 ANALISI IN CORSO SU: $file"
            echo "------------------------------------------------"
            
            # Eseguiamo il container passandogli il nome del file corrente
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file"
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa_report.log