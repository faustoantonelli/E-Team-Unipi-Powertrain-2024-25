name: Universal QA System

on:
  push:
    paths:
      - '**.cpp'
      - '**.py'
      - '**.m'
      - '**.tex'
  workflow_dispatch: # Permette di avviarlo anche manualmente per test

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        # Essendo il Dockerfile nella root, il comando è semplificato
        run: docker build -t qa-engine -f docker/Dockerfile .

      - name: Run Engine su tutti i file
        run: |
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          echo "Data: $(date)" >> qa_report.log
          echo "------------------------------------------------" >> qa_report.log
          
          # Cerchiamo i file ovunque (.) per evitare problemi di nomi cartelle
          # Il pipe '>> qa_report.log 2>&1' salva sia i risultati che gli errori
          find . -type f \( -name "*.cpp" -o -name "*.py" -o -name "*.m" -o -name "*.tex" \) \
          -not -path "*/tester.cpp" -not -path "*/.*" -print0 | while IFS= read -r -d '' file; do
            
            echo "------------------------------------------------" >> qa_report.log
            echo "🚀 ANALIZZANDO: $file" >> qa_report.log
            
            # Eseguiamo docker e reindirizziamo l'output nel file del report
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file" >> qa_report.log 2>&1 || true
            
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa_report.log