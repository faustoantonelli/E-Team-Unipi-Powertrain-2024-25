name: Universal QA System with History

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

permissions:
  contents: write # Serve 'write' per mantenere i file vecchi
  pages: write
  id-token: write

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Run Engine e Organizza Storico
        run: |
          # 1. Creiamo un nome cartella basato su data e ora (es. 2025-05-20_14-30)
          RUN_ID=$(date +'%Y-%m-%d_%H-%M')
          mkdir -p "public/$RUN_ID"
          
          # 2. Prepariamo la index della specifica run
          echo "<html><body style='font-family:sans-serif; padding:30px;'>" > "public/$RUN_ID/index.html"
          echo "<h1>🚀 Test Run: $RUN_ID</h1><ul>" >> "public/$RUN_ID/index.html"

          # 3. Analisi dei file
          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.m" -o -name "*.py" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file" 8
            
            if [ -f "$file.html" ]; then
              mv "$file.html" "public/$RUN_ID/"
              echo "<li><a href='$(basename "$file.html")'>$(basename "$file")</a></li>" >> "public/$RUN_ID/index.html"
            fi
          done
          echo "</ul><br><a href='../'>⬅️ Torna alla Home</a></body></html>" >> "public/$RUN_ID/index.html"

      # 4. Deploy speciale che non cancella il passato
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true # FONDAMENTALE: non cancella i test vecchi!
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'