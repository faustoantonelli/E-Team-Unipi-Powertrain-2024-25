name: Universal QA System

on:
  push:
  workflow_dispatch: 

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          # Cerca il Dockerfile ovunque per sicurezza
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Run Analysis
        run: |
          # Creiamo l'intestazione del log
          echo "==========================================" > qa_report.log
          echo "       REPORT QA AUTOMOTIVE SYSTEM       " >> qa_report.log
          echo "Data: $(date)" >> qa_report.log
          echo "==========================================" >> qa_report.log
          
          # Cerchiamo i file gestendo gli SPAZI nel nome
          # Cerchiamo sia .cpp che .tex (puoi aggiungere .py o .m se servono)
          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.tex" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            echo "🚀 Analisi in corso su: $file"
            
            # Eseguiamo il container. 
            # Il volume mount permette a tester.cpp di scrivere direttamente in qa_report.log
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file"
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa_report.log