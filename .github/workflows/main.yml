name: Universal QA System

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

# AGGIUNTO: PermOssi per scrivere su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Run Engine e Genera Dashboard
        run: |
          mkdir -p public
          # Inizializziamo la Home Page del sito
          echo "<html><body style='font-family:sans-serif; padding:50px; line-height:1.6;'>" > public/index.html
          echo "<h1 style='color:#1a73e8;'>🏎️ Traction Control Dashboard 2025-26</h1>" >> public/index.html
          echo "<h3>Seleziona un file per vedere i dettagli dell'analisi:</h3><ul>" >> public/index.html

          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.m" -o -name "*.py" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            # Eseguiamo il tester (genera sia log che html)
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file" 8
            
            # Spostiamo l'HTML nella cartella del sito e aggiungiamo il link
            REL_PATH=$(basename "$file")
            mv "$file.html" public/
            echo "<li><a href='$REL_PATH.html'>Analisi di $REL_PATH</a></li>" >> public/index.html
            
          done
          echo "</ul></body></html>" >> public/index.html

      # AGGIUNTO: Upload e Deploy automatico
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4