name: Universal QA System

on:
  push:
  workflow_dispatch: 

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          # Cerca il Dockerfile ovunque per sicurezza
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Run Engine su tutti i file
        run: |
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          echo "Data: $(date)" >> qa_report.log
          echo "Cartella target: Traction Control 2025-26" >> qa_report.log
          echo "------------------------------------------------" >> qa_report.log
          
          # Cerchiamo i file nella nuova cartella rinominata
          # Usiamo le virgolette per gestire lo spazio nel nome
          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.py" -o -name "*.m" -o -name "*.tex" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            echo "------------------------------------------------" >> qa_report.log
            echo "🚀 ANALIZZANDO: $file" >> qa_report.log
            
            # Eseguiamo docker e salviamo l'output (stdout + stderr) direttamente nel log
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file" >> qa_report.log 2>&1 || true
            
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa_report.log