name: C++ CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t tc-test -f docker/Dockerfile .
          
      - name: Run Tests
        run: |
          docker run --rm tc-test > test_report.txt
          cat test_report.txt
          
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Report-Test-Ufficiali
          path: test_report.txt