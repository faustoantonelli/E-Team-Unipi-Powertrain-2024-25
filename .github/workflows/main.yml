name: C++ CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t tc-test -f docker/Dockerfile .
          
      - name: Run Tests
        run: |
          docker run --rm tc-test > test_report.txt
          cat test_report.txt

      - name: Run Static Analysis (Clang-Tidy)
        run: |
          sudo apt-get install -y clang-tidy
          # Esegue clang-tidy su tutti i file sorgenti
          clang-tidy src/*.cpp include/*.h -- -I./include -std=c++17 || true
          
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Report-Test-Ufficiali
          path: test_report.txt

      - name: Generate Documentation
        run: |
          sudo apt-get install -y doxygen graphviz
          mkdir -p docs/doxygen
          doxygen Doxyfile
          
      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doxygen-HTML
          path: docs/doxygen/html/