name: Universal QA System

on:
  push:
  workflow_dispatch: 

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: |
          # Cerca il Dockerfile ovunque per sicurezza
          DOCKER_PATH=$(find . -name Dockerfile -print -quit)
          docker build -t qa-engine -f "$DOCKER_PATH" .

      - name: Run Engine su tutti i file
        run: |
          # 1. Creiamo il file (questo sarà l'artifact)
          echo "--- REPORT QA GLOBALE ---" > qa_report.log
          echo "Data: $(date)" >> qa_report.log
          
          # 2. Eseguiamo il tester su ogni file
          # Usiamo '>>' per aggiungere l'output del C++ nel file .log
          find "Traction Control 2025-26" -type f \( -name "*.cpp" -o -name "*.m" -o -name "*.py" \) \
          -not -path "*/tester.cpp" -print0 | while IFS= read -r -d '' file; do
            
            echo -e "\nAnalisi di: $file" >> qa_report.log
            # CATTURIAMO L'OUTPUT DEL TESTER QUI:
            docker run --rm -v ${{ github.workspace }}:/github/workspace qa-engine "$file" >> qa_report.log 2>&1 || true
            
          done

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Report-Traction-2025-26
          path: qa_report.log