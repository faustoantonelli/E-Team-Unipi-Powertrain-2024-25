name: QA System - E-Team Unified Dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  qa-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Build Engine
        run: docker build -t qa-engine .

      - name: Esecuzione Test e Generazione Report
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M')
          mkdir -p "deploy/runs/$TIMESTAMP"
          
          # Stile CSS unificato (Verde E-Team) per le pagine indice
          STYLE="<style>body{font-family:'Segoe UI',sans-serif;background:#f4f7f6;color:#333;padding:40px;} .card{max-width:900px;margin:auto;background:white;padding:30px;border-top:8px solid #1B4332;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.1);} h1{color:#1B4332;text-transform:uppercase;} .btn{display:inline-block;padding:10px 20px;background:#1B4332;color:white;text-decoration:none;border-radius:5px;margin:5px;transition:0.3s;} .btn:hover{background:#2d5a47;} li{list-style:none;margin:10px 0;}</style>"
          
          echo "<html><head>$STYLE</head><body><div class='card'><h1>🚀 Sessione: $TIMESTAMP</h1><ul>" > "deploy/runs/$TIMESTAMP/index.html"

          # Esegue il tester su ogni file .cpp trovato
          find "Traction Control 2025-26" -name "*.cpp" | while read file; do
            BASE_NAME=$(basename "$file")
            docker run -v $(pwd):/app qa-engine /engine "$file" 10
            mv "report.html" "deploy/runs/$TIMESTAMP/$BASE_NAME.html"
            echo "<li><a class='btn' href='$BASE_NAME.html'>📂 Analisi: $BASE_NAME</a></li>" >> "deploy/runs/$TIMESTAMP/index.html"
          done

          echo "</ul><br><a href='../../index.html'>⬅ Torna all'Archivio</a></div></body></html>" >> "deploy/runs/$TIMESTAMP/index.html"

      - name: Recupero Cronologia e Deploy
        run: |
          # Prova a recuperare i vecchi test per non perderli
          git clone --branch gh-pages https://github.com/${{ github.repository }}.git old_pages || true
          if [ -d "old_pages/runs" ]; then cp -r old_pages/runs/* deploy/runs/; fi

          # Genera la Home Page (Archivio Storico) con lo stesso stile
          STYLE_HOME="<style>body{font-family:'Segoe UI',sans-serif;background:#f4f7f6;padding:40px;} .container{max-width:900px;margin:auto;} .session-card{background:white;padding:20px;margin-bottom:15px;border-left:10px solid #1B4332;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-decoration:none;color:inherit;transition:0.2s;} .session-card:hover{transform:translateX(10px); background:#f1f8f5;} h1{color:#1B4332; border-bottom:3px solid #1B4332; padding-bottom:10px;}</style>"
          
          echo "<html><head>$STYLE_HOME</head><body><div class='container'><h1>🏎️ Archivio QA E-Team</h1>" > deploy/index.html
          ls -d deploy/runs/* 2>/dev/null | sort -r | while read dir; do
            LABEL=$(basename "$dir")
            echo "<a href='runs/$LABEL/index.html' class='session-card'><span>📅 Sessione del $LABEL</span><b>VEDI REPORT ⮕</b></a>" >> deploy/index.html
          done
          echo "</div></body></html>" >> deploy/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4